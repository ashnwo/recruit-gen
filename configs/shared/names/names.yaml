# Name rules and hand-built name pools. Shared by every sport.
# The big tables next to this file come from public data:
#   first_names.csv - SSA baby names, boys born 2005-2010, expected births per group
#   surnames.csv    - 2010 US Census surnames, people per group
# (Both were cleaned in Step 1: girls' names logged as boys, typos and placeholders removed.)

# ---- fit: keeps names believable for the player's background -------------------
# A first name can be used for a group only if EITHER rule passes:
#   1. at least min_group_births boys in that group got it (2005-2010), or
#   2. that group is at least min_group_share of all boys with the name.
# Same idea for last names with Census counts (people of all ages).
fit:
  min_group_births: 100
  min_group_share: 0.25
  surname_min_group_people: 250
  surname_min_group_share: 0.15
  cross_mix: 0.05            # share of players with a first name usually linked to another group (must still fit his)
  polynesian_us_min_births: 1500   # Polynesian players only get common US first names

# ---- creative African-American names ------------------------------------------
# distinctive_share: a first name counts as distinctively Black above this share.
# distinctive_boost: how much more often those names come up, by --distinctive level.
# Styling: Deandre -> DeAndre or De'Andre when a name is a known prefix + root.
distinctive:
  distinctive_share: 0.6
  distinctive_boost: {low: 1.0, normal: 1.7, high: 2.8}
  style_rate: 0.5        # chance a name that fits the pattern gets styled
  camel_share: 0.55       # DeAndre style; the rest get De'Andre style
  prefixes: ["De", "Da", "Ja", "Ke", "La", "Le", "Ta", "Te", "Ty", "Tre", "Qua", "Za", "Ka", "Ra", "Jah", "Ny", "Sha", "Ki", "Ky", "Ji", "Jo", "Je", "Zy", "Tra"]
  roots: ["andre", "andrae", "shawn", "shaun", "sean", "marcus", "mario", "marion", "von", "vonte", "vonta", "vante", "vion", "vonn", "quan", "quann", "juan", "ron", "rell", "darius", "darrius", "marr", "mari", "marri", "mere", "quez", "shun", "dre", "varius", "veon", "korey", "kwon", "wan", "wayne", "vontae", "monte", "montre", "marco", "lon", "reon", "rion", "rian", "vaughn", "vaun", "tavious", "quavious", "vious", "darrion", "darion", "trell", "trey", "vonte", "cori", "corey", "anthony", "angelo", "aundre", "zion", "kari"]

# ---- sharpen: small groups pick up 'noise' names; raising each name's group
# share to this power favors names typical FOR the group.
sharpen: {white: 0.0, black: 0.15, hispanic: 0.6, asian: 1.2}

# ---- nicknames and suffixes ------------------------------------------------------
nicknames:
  initials_rate: 0.045     # chance he goes by initials (CJ, DJ...)
  initials: {AJ: 10, BJ: 4, CJ: 12, DJ: 12, EJ: 3, JJ: 6, KJ: 5, MJ: 3, PJ: 4, RJ: 4, TJ: 10, JT: 3, JD: 2, JC: 2, JB: 2, JR: 1, DK: 1, TK: 1, KT: 1}
  dotted_share: 0.15       # C.J. instead of CJ
  trey_rate: 0.35          # share of IIIs who go by Trey
suffix_rates:
  black: {"Jr.": 0.075, II: 0.025, III: 0.012, IV: 0.002}
  white: {"Jr.": 0.035, II: 0.012, III: 0.012, IV: 0.003}
  hispanic: {"Jr.": 0.03, II: 0.004}
  polynesian: {"Jr.": 0.05, II: 0.01, III: 0.005}
  default: {"Jr.": 0.01}

