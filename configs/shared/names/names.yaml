# ---- heritage: family names that point to a specific background -------------------
# The Census only says "this surname is mostly Black" or "mostly Asian". It can't
# tell a Nigerian family (Okafor) from a Haitian one (Jean-Baptiste) from an
# African-American one (Gadson), or a Gujarati family (Patel) from a Korean one
# (Kim). These lists fill that gap.
#
# A player whose surname is on a list (and whose group is in `groups`) gets:
#   - a first name from `first` heritage_first_share of the time, otherwise a
#     mainstream American first name (never a creative-spelling one)
#   - a Jr./II/III only if `suffixes: true`
# reserve_first: true  -> those first names are ONLY used for that heritage within
#                         the group (so no "Ravi Zheng" or "Kenji Patel")
# default_for          -> heritage for players in that group whose surname isn't listed
# pools                -> also count the surnames/first names of these hand-built pools
# max_white_share      -> skip listed surnames that are also common white names
#                         (Wade, Barry, Kane are Senegalese AND common Anglo names)
# mainstream_max_share -> the "mainstream American" first names leave out names this
#                         typical of the group (0.6 = no creative-spelling names for Black
#                         families; 0.5 = no Akhilesh or Minh for Asian families)
# auto_first_min_share -> also count any first name at least this typical of the group
#                         (catches South Asian names that aren't on the hand list)
# surname_patterns     -> surname endings that mark this heritage when the name isn't listed
# mainstream_min_births -> "mainstream American" first names must be at least this common
# first_patterns       -> first-name patterns that also belong to this heritage (Abd..., ...ullah)
# mainstream_max_hispanic -> also leave out mainstream names this Hispanic (no "Diego Syed")
