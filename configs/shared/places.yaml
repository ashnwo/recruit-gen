# Where recruits come from. Shared by every sport.
#
# states:    name, cities {city: weight}, eth_mult {group: multiplier}
#            City weights = roughly how many recruits come from there (bigger
#            metros and known hotbeds weigh more). eth_mult nudges a state's
#            ethnicity odds, e.g. Hawaii and Utah produce far more Polynesian players.
# default_eth_mult: nudge for states that don't list a group themselves. Polynesian
#            families are concentrated in a few Western states (and Texas), so most
#            states sit well below the national rate (Census: ~0.1-0.3x).
# countries: name, cities, ethnicity {group: share of that country's recruits},
#            name_pools {group: {pool: weight}} - us_black/us_white/us_hispanic/us_asian
#            use the big US tables; any other pool is in names/names.yaml
# schools:   patterns for made-up high school names

