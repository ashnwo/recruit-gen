schools:
  # {city} = hometown, {name} = a namesake, {dir} = a direction, {saint} = a saint/bishop name
  patterns:
    - {text: "{city} High School", weight: 30}
    - {text: "{city} {dir} High School", weight: 10}
    - {text: "{name} High School", weight: 22}
    - {text: "{saint} Catholic", weight: 7}
    - {text: "{saint} High School", weight: 4}
    - {text: "{city} Christian Academy", weight: 5}
    - {text: "{city} Prep", weight: 3}
