# Talent and rankings (football ranks far more players than basketball).
talent:
  international_error_mult: 1.25
  population: 250000
  pool_size: 3500
  scout_error: 0.25
  stars:
    - {stars: 5, last_rank: 32, rating: [100, 98]}
    - {stars: 4, last_rank: 350, rating: [97, 90]}
    - {stars: 3, last_rank: 2200, rating: [89, 80]}
    - {stars: 2, last_rank: 3500, rating: [79, 70]}
  verdicts:
    steal: 4
    underrated: 1.75
    overrated: 1.75
    bust: 4
    min_gap: 5

origins:
  international_rate: 0.004
  states: {TX: 14, FL: 13, GA: 9, CA: 9, LA: 4.2, AL: 4, OH: 4, NC: 3.5, SC: 2.6, TN: 2.6, MS: 2.5, VA: 2.5, MD: 2.4, PA: 2.4, NJ: 2, MI: 2, IL: 2, AZ: 1.6, OK: 1.3, AR: 1, KY: 0.9, MO: 1.2, IN: 1, WA: 1, UT: 1, HI: 0.6, NV: 1, CO: 0.8, KS: 0.5, OR: 0.6, MN: 0.6, WI: 0.6, IA: 0.5, NE: 0.4, DC: 0.6, NY: 1, MA: 0.5, CT: 0.4, DE: 0.3, WV: 0.3, NM: 0.3, ID: 0.2, AS: 0.15, AK: 0.05, ME: 0.05, NH: 0.05, VT: 0.02, MT: 0.1, ND: 0.08, SD: 0.08, WY: 0.05, RI: 0.1}
  countries: {CAN: 0.6, AUS: 0.2, NGA: 0.1, DEU: 0.1}

# National prep programs (far less common in football than basketball).
prep:
  rate: 0.05
  star_boost: {5: 2.5, 4: 1.5, 3: 0.8, 2: 0.4}
  international_rate: 0.3
  schools: {"IMG Academy (Bradenton, FL)": 3, "Mater Dei (Santa Ana, CA)": 2, "St. John Bosco (Bellflower, CA)": 2, "St. Thomas Aquinas (Fort Lauderdale, FL)": 2, "Bishop Gorman (Las Vegas, NV)": 1, "St. Frances Academy (Baltimore, MD)": 1, "Duncanville (Duncanville, TX)": 1, "Buford (Buford, GA)": 1, "Grayson (Loganville, GA)": 1, "Hoover (Hoover, AL)": 1, "Thompson (Alabaster, AL)": 1, "Chandler (Chandler, AZ)": 1, "St. Joseph's Prep (Philadelphia, PA)": 1, "Kahuku (Kahuku, HI)": 1, "Mililani (Mililani, HI)": 1}

development:
  gap_spread: 0.3
  trajectories:
    "Early Bloomer":  {weight: 0.22, gap: 0.20, bias: 0.5,   noise: 0.0,  growth: "Low"}
    "Steady Climber": {weight: 0.45, gap: 0.55, bias: 0.0,   noise: 0.0,  growth: "Medium"}
    "Late Bloomer":   {weight: 0.22, gap: 0.95, bias: -0.5,  noise: 0.15, growth: "High"}
    "Raw Project":    {weight: 0.11, gap: 1.30, bias: -0.15, noise: 0.3,  growth: "Very High"}

# College Football / Madden dev traits, from TRUE talent (plus a little noise).
# Each trait needs at least this talent score (0 = typical ranked recruit). Checked top-down.
dev_traits:
  noise: 0.25
  levels: {Elite: 2.55, Star: 1.85, Impact: 1.05, Normal: -99}

ratings:
  default_role: none    # skills a position never uses (a tackle's kicking) sit at the bottom
  min: 12
  max: 99
  levels: {core: [62, 4.8], major: [52, 4.3], minor: [41, 3.6], low: [28, 2.6], none: [16, 2.0]}
  group_spread: 3.0
  attr_noise: 2.4
  ovr_weights: {core: 3, major: 1.2, minor: 0.3, low: 0, none: 0}
  potential: {center: 70, per_sd: 6.5, noise: 1.5, min: 55, max: 97}
  athletic_from_talent: 0.25

# 40-yard dash, worked out from a speed rating:
#   time = at_95 + (95 - rating) x per_point (+ noise), kept between min and max
forty: {rating: SPD, at_95: 4.35, per_point: 0.0215, noise: 0.03, min: 4.22, max: 5.9}

# Attributes use the College Football / Madden edit-screen abbreviations.
attributes:
  order: ["SPD", "ACC", "AGI", "COD", "STR", "JMP", "STA", "TGH", "INJ", "AWR", "PRC", "THP", "SAC", "MAC", "DAC", "TOR", "TUP", "BSK", "PAC", "CAR", "BCV", "BTK", "TRK", "SFA", "SPM", "JKM", "CTH", "SPC", "CIT", "SRR", "MRR", "DRR", "RLS", "RBK", "RBP", "RBF", "IBL", "LBK", "PBK", "PBP", "PBF", "PMV", "FMV", "BSH", "TAK", "HPW", "PUR", "MCV", "ZCV", "PRS", "KPW", "KAC", "RET"]
