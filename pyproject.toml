[project]
name = "recruit-gen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.167.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
recruit-gen = "recruit_gen.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
